 for(let j=0;j<S;j++)for(let i=0;i<S;i++){const t=map[Math.min(N-1,j*2)*N+Math.min(N-1,i*2)],c=pal[t]||pal[3],h=G3.hAt(i*2*T,j*2*T),h1=G3.hAt(Math.max(0,i*2-3)*T,Math.max(0,j*2-3)*T),s=Math.max(-28,Math.min(28,(h-h1)*26)),k=(j*S+i)*4;im.data[k]=c[0]+s;im.data[k+1]=c[1]+s;im.data[k+2]=c[2]+s;im.data[k+3]=255}
 x.putImageData(im,0,0);const f=fogc.getContext('2d');f.fillStyle='rgba(6,10,8,.9)';f.fillRect(0,0,S,S);lx=-1e9}
function reveal(){const f=fogc.getContext('2d'),px=P.x/T/2,py=P.y/T/2,r=34,g=f.createRadialGradient(px,py,r*.5,px,py,r);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');f.globalCompositeOperation='destination-out';f.fillStyle=g;f.beginPath();f.arc(px,py,r,0,7);f.fill();f.globalCompositeOperation='source-over'}
function drawMap(){if(!open)return;const c=$('wmc'),z=Math.min(innerWidth*.92,innerHeight*.8,900)|0,d=devicePixelRatio||1;c.style.width=c.style.height=z+'px';c.width=c.height=z*d;const g=c.getContext('2d');g.scale(d,d);g.drawImage(base,0,0,z,z);g.drawImage(fogc,0,0,z,z);
 g.strokeStyle='rgba(255,255,255,.12)';g.fillStyle='rgba(255,255,255,.55)';g.font='10px system-ui';for(let i=0;i<8;i++){const q=z/8*i;g.beginPath();g.moveTo(q,0);g.lineTo(q,z);g.moveTo(0,q);g.lineTo(z,q);g.stroke();g.fillText(LT[i],q+z/16,11);g.fillText(i+1,3,q+z/16)}
 const k=z/WS,t=performance.now()/1000,ph=(t%1.6)/1.6,px=P.x*k,py=P.y*k;nests.forEach(n=>{if(n.own){g.fillStyle='#ffd75a';g.fillRect(n.x*k-3,n.y*k-3,6,6)}});
 g.strokeStyle='rgba(255,230,160,'+(.8-.7*ph)+')';g.lineWidth=2;g.beginPath();g.arc(px,py,6+ph*22,0,7);g.stroke();
 g.save();g.translate(px,py);g.rotate(P.a);g.fillStyle='#ff5a3c';g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(10,0);g.lineTo(-7,6);g.lineTo(-4,0);g.lineTo(-7,-6);g.closePath();g.fill();g.stroke();g.restore();
 $('wmi').innerHTML='<b>Карта острова</b><span>Квадрат '+LT[Math.min(7,P.x/WS*8|0)]+(Math.min(7,P.y/WS*8|0)+1)+' · '+clock()+'</span><small>Неисследованное скрыто · коснись, чтобы закрыть</small>';requestAnimationFrame(drawMap)}
function toggle(){if(!P||P.dead||MS)return;open=!open;wm.classList.toggle('on',!!open);if(open){if(mapRef!==map)build();drawMap()}}
function call(){if(!P||P.dead||paused||MS)return;if(P.callCd>0){msg('📣 Зов восстанавливается: '+Math.ceil(P.callCd)+' с');return}
